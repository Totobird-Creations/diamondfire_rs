[package]
name        = "bridgecg_diamondfire"
version     = "0.1.0"
authors     = [ "Totobird Creations <https://github.com/Totobird-Creations>" ]
description = "Codegen/linker common datatypes and functions for the DiamondFire block language compiler target"

edition = "2024"

[features]
extern_names = [ ]
bridge_items = [ "dfmir" ]
dfmir        = [ "rustc_private" ]
dflir        = [ ]

rustc_private = [ ]
bincode       = [ "dep:bincode" ]
static_intern = [ "dep:static-intern" ]

[package.metadata.rust-analyzer]
rustc_private = true

[lints.rust]
unused_parens = "allow"


[dependencies.bincode]
version  = "2.0"
optional = true

[dependencies.static-intern]
git      = "https://github.com/Totobird-Creations/static-intern"
commit   = "0305f17fa72426c2afe8c36a621528e25e16c6b6"
optional = true
